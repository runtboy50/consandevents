<style>
/* Layout: wide dark month grid on top, day-grouped line-up list below; indigo chips for single days, red for multi-day runs. Dark-first, light as the alternate. */
:root {

  --accent: #ff4b66;
  --chip-bg: #262c5c;
  --chip-edge: #8b93ff;
  --chip-fg: #e4e6ff;
  --multi-bg: #3d1a26;
  --multi-edge: #ff4b66;
  --today: #3a3414;
  --warn-bg: #3b3514;
  --warn-fg: #f0d96a;
  --ok: #6fd49a;

    --accent: #d81f3f; --chip-bg: #e1e4ff; --chip-edge: #4f58d6; --chip-fg: #1f2466;
    --multi-bg: #ffe1e7; --multi-edge: #d81f3f; --today: #fff0b8; --warn-bg: #fff0b3; --warn-fg: #6b5800; --ok: #1c7d4c;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f4fb; --panel: #ffffff; --panel2: #eceef8; --line: #d6d9ea; --fg: #171a2b; --muted: #5e6483;
  --accent: #d81f3f; --chip-bg: #e1e4ff; --chip-edge: #4f58d6; --chip-fg: #1f2466;
  --multi-bg: #ffe1e7; --multi-edge: #d81f3f; --today: #fff0b8; --warn-bg: #fff0b3; --warn-fg: #6b5800; --ok: #1c7d4c;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {

  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;

a { color: inherit; }
:focus-visible { outline: 2px solid var(--chip-edge); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; padding-bottom: 18px; border-bottom: 2px solid var(--fg); }
.top > * { min-width: 0; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 56px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }

.sub a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }

.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 14px; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0 14px; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-size: 15px; }
.btn:hover { background: var(--panel2); }
.btn[aria-pressed="true"] { border-color: var(--chip-edge); background: var(--chip-bg); color: var(--chip-fg); }
.btn.sq { padding: 9px 0; width: 42px; text-align: center; }
.month { display: flex; align-items: baseline; gap: 10px; margin: 0 6px; flex-wrap: wrap; }
.month h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 4.2vw, 38px); letter-spacing: -0.02em; line-height: 1.1; }
.month .be { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.search { flex: 1 1 220px; min-width: 0; margin-left: auto; max-width: 420px; }

#banner { background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }

.cal { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--line); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; }
.wd { background: var(--panel); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; padding: 10px 10px; color: var(--muted); }
.wd.hot { color: var(--accent); }
.cell { background: var(--panel); min-height: 124px; padding: 8px 6px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.cell.out .dnum { color: var(--muted); opacity: .7; }
.cell.today { background: var(--today); }
.dnum { align-self: flex-start; background: none; border: 0; padding: 0 4px; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.chip { display: block; width: 100%; text-align: left; background: var(--chip-bg); color: var(--chip-fg); border: 0; border-left: 3px solid var(--chip-edge); border-radius: 3px; padding: 4px 8px; font-size: 13px; line-height: 1.3; min-width: 0; }
.chip .lbl { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.dhead { display: flex; flex-direction: column; }
.dn { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -0.03em; }
.dw { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; color: var(--accent); margin-top: 6px; }
.evs { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.ev { scroll-margin-top: 16px; border-radius: 6px; }
.ev.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--chip-bg); } 100% { background: transparent; } }
.ev-title { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.3; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.ev-title a { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.ev-title .t { overflow-wrap: anywhere; }
.ev.cancelled .t { text-decoration: line-through; color: var(--muted); }
.b { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 4px; font-weight: 500; white-space: nowrap; background: var(--panel2); color: var(--muted); }
.b-multi { background: var(--multi-bg); color: var(--accent); }
.b-warn { background: var(--warn-bg); color: var(--warn-fg); }
.b-ok { background: none; color: var(--ok); padding: 0; font-size: 15px; }
.b-now { background: var(--today); color: var(--fg); }
.ev-meta { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 20px; color: var(--muted); font-size: 14.5px; }
.ev-meta > span { overflow-wrap: anywhere; min-width: 0; }
.ev-meta svg { width: 13px; height: 13px; vertical-align: -1px; margin-right: 6px; fill: var(--accent); }
.ev-meta s { opacity: .8; margin-left: 4px; }
.ev-meta a.src { color: var(--accent); font-weight: 600; text-decoration: none; }
.ev-meta a.src:hover { text-decoration: underline; }
.ev-note { margin: 8px 0 0; font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; overflow-wrap: anywhere; }
.ev-note .nl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent); }
.pills { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pill { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; font-size: 14px; font-family: inherit; color: var(--fg); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.pill:hover { border-color: var(--chip-edge); background: var(--chip-bg); color: var(--chip-fg); }
.pill.x { text-decoration: line-through; color: var(--muted); }
.empty { padding: 28px 0; color: var(--muted); border-top: 1px solid var(--line); }

/* artist side panel */
#scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 20; }
#side { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 30; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0, 0, 0, 0.28); transform: translateX(100%); visibility: hidden; transition: transform 0.22s ease, visibility 0.22s; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
#side.open { transform: none; visibility: visible; }
.s-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.s-head > div { min-width: 0; }
.s-eyebrow { margin: 0 0 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--accent); }
#sideTitle { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; overflow-wrap: anywhere; }

.s-next { margin: 0; color: var(--muted); font-size: 14px; }
.s-next b { color: var(--fg); font-weight: 600; }
.s-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 18px 0 0; }
.s-stats > div { min-width: 0; }
.s-stats dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.s-stats dd { margin: 2px 0 0; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.s-h { margin: 24px 0 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.s-years, .s-venues, .s-list { list-style: none; margin: 0; padding: 0; }
.s-years li { display: grid; grid-template-columns: 40px minmax(0, 1fr) 24px; gap: 10px; align-items: center; padding: 3px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.s-years .y { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.s-years .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }

.s-venues li > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.s-venues .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.s-list li button { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 4px; border-radius: 0; }
.s-list li button:hover { background: var(--panel2); }
.s-list .d { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.s-list .ck { color: var(--ok); }
.s-list .t { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.s-list .v, .s-list .nt { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.s-empty { margin: 20px 0 0; color: var(--muted); }
.s-foot { margin: 20px 0 0; color: var(--muted); font-size: 12.5px; }
@media (min-width: 901px) { #scrim { display: none !important; } }
@media (prefers-reduced-motion: reduce) { #side { transition: none; } }

@media (max-width: 640px) {
  body { padding-block: 14px 40px; }
  .top-right { align-items: flex-start; }
  .search { margin-left: 0; flex-basis: 100%; max-width: none; order: 9; }
  .wd { padding: 8px 2px; text-align: center; font-size: 10px; letter-spacing: 0.04em; }

  .dn { font-size: 30px; }

}
@media (prefers-reduced-motion: reduce) { .ev.flash { animation: none; } }

<script>
(function () {
  "use strict";

  var MON = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
  var WD = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  var now = new Date();
  var state = {
    tabs: {},            // year -> events[]
    view: { y: now.getFullYear(), m: now.getMonth() },
    q: "", marked: false, artist: "",

  };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function key(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
  function todayKey() { var t = new Date(); return key(t.getFullYear(), t.getMonth(), t.getDate()); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function $(id) { return document.getElementById(id); }

  /* ---------- parsing ---------- */
  function enumerate(y1, m1, d1, y2, m2, d2) {
    var out = [], d = new Date(y1, m1, d1), end = new Date(y2, m2, d2), n = 0;
    while (d <= end && n < 400) { out.push(key(d.getFullYear(), d.getMonth(), d.getDate())); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); n++; }
    return out;
  }
  function parseDate(raw, year) {
    var s = String(raw || "").trim().replace(/[–—]/g, "-").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ");
    var m;
    if ((m = s.match(/^([A-Za-z]{3})[a-z]*$/)) && MON[m[1].toLowerCase()] !== undefined) return { tba: MON[m[1].toLowerCase()], days: [] };
    if ((m = s.match(/^(\d{1,2}) ([A-Za-z]{3})[a-z]*-(\d{1,2}) ([A-Za-z]{3})[a-z]*$/))) {
      var a = MON[m[2].toLowerCase()], b = MON[m[4].toLowerCase()];

      var ey = b < a ? year + 1 : year;
      return { days: enumerate(year, a, +m[1], ey, b, +m[3]) };

    if ((m = s.match(/^([\d,\-\s]+) ([A-Za-z]{3})[a-z]*$/))) {
      var mon = MON[m[2].toLowerCase()];
      if (mon === undefined) return null;
      var days = [];
      m[1].split(",").forEach(function (seg) {

        var s1 = +r[1], e1 = r[2] ? +r[2] : s1;

      });
      return days.length ? { days: days } : null;
    }
    return null;
  }

  function parseRows(year, rows) {
    var events = [], cur = null;
    rows.forEach(function (r, i) {
      var colA = (r[0] || "").trim();
      var colB = (r[1] || "").trim();
      var colC = (r[2] || "").trim();
      var colD = (r[3] || "").trim();
      var colE = (r[4] || "").trim();

        cur = null;
      } else if (cur && colC) {
        cur.artists.push({ name: colC, struck: false });
        if (colG) cur.note = cur.note ? cur.note + " · " + colG : colG;
      } else if (cur && !colA && colD && !colE && !colF) {
        cur.artists.push({ name: colD, struck: false });
      }
    });

    events.forEach(function (ev) {
      ev.cancelled = false;
      ev.name = ev.title || (ev.artists[0] && ev.artists[0].name) || "Untitled";
      ev.label = (ev.artists[0] && ev.artists[0].name) || ev.title || "Untitled";
      ev.first = ev.days[0] || (ev.year + "-" + pad((ev.tba !== undefined ? ev.tba + 1 : 1)) + "-99");
      ev.last = ev.days.length ? ev.days[ev.days.length - 1] : ev.first;
      ev.hay = [ev.name, ev.venue, ev.oldVenue, ev.promoter, ev.note || "", ev.dateText, ev.artists.map(function (a) { return a.name; }).join(" ")].join(" ").toLowerCase();
    });
    return events;
  }

  function allEvents() {
    var out = [];
    Object.keys(state.tabs).forEach(function (y) { out = out.concat(state.tabs[y]); });
    out.sort(function (a, b) { return a.first < b.first ? -1 : a.first > b.first ? 1 : (a.year - b.year) || (parseInt(a.id.split("-")[1], 10) - parseInt(b.id.split("-")[1], 10)); });
    return out;
  }
  function visible(ev) {
    if (state.marked && !ev.marked) return false;
    if (state.q && ev.hay.indexOf(state.q) === -1) return false;
    return true;
  }
  function sourceLabel(u) {
    try {
      var h = new URL(u).hostname.replace(/^www\./, "");
      var map = { "facebook.com": "Facebook", "instagram.com": "Instagram", "x.com": "X", "twitter.com": "X", "ticketmelon.com": "Ticketmelon", "thaiticketmajor.com": "Thai Ticket Major", "eventpop.me": "Eventpop", "megatix.in.th": "Megatix", "zipeventapp.com": "Zipevent" };
      return map[h] || h;
    } catch (e) { return "Link"; }
  }

  /* ---------- rendering ---------- */
  var renderQueued = false;
  function schedule() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(function () { renderQueued = false; render(); }); }

  function renderStats(evs) {
    var tk = todayKey(), yr = new Date().getFullYear();
    var live = evs.filter(function (e) { return !e.cancelled; });
    var upcoming = live.filter(function (e) { return e.last >= tk; }).length;
    var inYear = live.filter(function (e) { return e.year === yr; }).length;
    var years = Object.keys(state.tabs).filter(function (y) { return state.tabs[y].length; }).map(Number).sort();
    $("stats").innerHTML = state.synced
      ? "<span><b>" + upcoming + "</b> upcoming</span><span><b>" + inYear + "</b> in " + yr + "</span>" + (years.length ? "<span><b>" + live.length + "</b> since " + years[0] + "</span>" : "")
      : "";
  }

  function renderGrid(byDay) {
    var y = state.view.y, m = state.view.m, tk = todayKey();
    var first = new Date(y, m, 1), dim = new Date(y, m + 1, 0).getDate();
    var weeks = Math.ceil((first.getDay() + dim) / 7);
    var html = WD.map(function (w, i) { return '<div class="wd' + (i === 0 || i === 6 ? " hot" : "") + '">' + w + "</div>"; }).join("");
    for (var w = 0; w < weeks; w++) for (var d = 0; d < 7; d++) {
      var dt = new Date(y, m, 1 - first.getDay() + w * 7 + d);
      var k = key(dt.getFullYear(), dt.getMonth(), dt.getDate());
      var evs = (byDay[k] || []).filter(visible);
      var cls = "cell" + (dt.getMonth() !== m ? " out" : "") + (k === tk ? " today" : "");
      var chips = evs.slice(0, 3).map(function (e) {
        return '<button type="button" class="chip' + (e.days.length > 1 ? " multi" : "") + (e.cancelled ? " cancel" : "") + '" data-act="ev" data-id="' + esc(e.id) + '" title="' + esc(e.name + (e.note ? " · " + e.note : "")) + '"><span class="lbl">' + (e.marked ? "✔ " : "") + esc(e.label) + "</span></button>";
      }).join("");
      var more = evs.length > 3 ? '<button type="button" class="more" data-act="day" data-key="' + k + '">+' + (evs.length - 3) + " more</button>" : "";
      html += '<div class="' + cls + '"><button type="button" class="dnum" data-act="day" data-key="' + k + '">' + dt.getDate() + "</button>" + chips + more + "</div>";
    }
    $("cal").innerHTML = html;
  }

  var PIN = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C4.7 0 2.5 2.4 2.5 5.4 2.5 9.2 8 16 8 16s5.5-6.8 5.5-10.6C13.5 2.4 11.3 0 8 0zm0 7.6a2.3 2.3 0 110-4.6 2.3 2.3 0 010 4.6z"/></svg>';

  function card(ev) {
    var tk = todayKey(), badges = "";
    if (ev.oldVenue && ev.venue) badges += '<span class="b b-warn">Venue changed</span>';
    if (ev.marked) badges += '<span class="b b-ok" title="Been there">✔</span>';
    if (ev.last < tk && ev.days.length) badges += '<span class="b">past</span>';
    var url = safeUrl(ev.link);
    var title = url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" class="t">' + esc(ev.name) + "</a>" : '<span class="t">' + esc(ev.name) + "</span>";
    var venue = ev.venue || ev.oldVenue
      ? "<span>" + PIN + esc(ev.venue || "") + (ev.oldVenue && ev.venue ? "<s>" + esc(ev.oldVenue) + "</s>" : (!ev.venue ? "<s>" + esc(ev.oldVenue) + "</s>" : "")) + "</span>" : "";
    var prom = ev.promoter ? "<span>Promoter: " + esc(ev.promoter) + "</span>" : "";
    var src = url ? '<span><a class="src" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Source: ' + esc(sourceLabel(url)) + " ↗</a></span>" : "";
    var note = ev.note ? '<p class="ev-note"><span class="nl">NOTE</span>' + esc(ev.note) + "</p>" : "";
    var pills = ev.artists.length ? '<ul class="pills">' + ev.artists.map(function (a) { return '<li><button type="button" class="pill' + (a.struck ? " x" : "") + '" data-act="artist" data-name="' + esc(a.name) + '">' + esc(a.name) + "</button></li>"; }).join("") + "</ul>" : "";
    return '<article class="ev' + (ev.cancelled ? " cancelled" : "") + '" id="ev-' + esc(ev.id) + '"><h3 class="ev-title">' + title + badges + '</h3><p class="ev-meta">' + venue + prom + src + "</p>" + note + pills + "</article>";
  }

  function renderList(evs) {
    var y = state.view.y, m = state.view.m, list = $("list");
    var pre = y + "-" + pad(m + 1) + "-";
    var groups = [], map = {}, searching = !!(state.q || state.marked);
    if (state.loading && !evs.length) {
      list.innerHTML = '<div class="empty">Reading your sheet…</div>';
      return;
    }
    var shown;
    if (searching) {
      shown = evs.filter(visible);
      $("lTitle").textContent = state.q ? "Search results" : "Shows you've been to";
      $("lHint").textContent = shown.length + (shown.length === 1 ? " entry" : " entries") + " across every year in your sheet. Clear the search to return to the month.";
    } else {
      shown = evs.filter(function (e) { return e.days.some(function (k) { return k.indexOf(pre) === 0; }) || (e.tba === m && e.year === y); });
      $("lTitle").textContent = MONTHS[m] + " line-up";
      $("lHint").textContent = "Tap a date to jump to it. Red entries run over several days; struck-through entries were cancelled.";
    }
    shown.forEach(function (e) {
      var gk;
      if (!e.days.length) gk = "tba-" + e.year + "-" + e.tba;
      else if (searching) gk = e.first;
      else gk = e.days.filter(function (k) { return k.indexOf(pre) === 0; })[0];
      if (!map[gk]) { map[gk] = { key: gk, evs: [], tba: !e.days.length, year: e.year, mon: e.tba }; groups.push(map[gk]); }
      map[gk].evs.push(e);
    });
    if (!groups.length) {
      list.innerHTML = '<div class="empty">' + (searching ? "Nothing matches." : "No shows listed for " + MONTHS[m] + " " + y + ".") + "</div>";
      return;
    }
    list.innerHTML = groups.map(function (g) {
      var head;
      if (g.tba) head = '<span class="dn" style="font-size:26px">TBA</span><span class="dw">' + MONTHS[g.mon].slice(0, 3).toUpperCase() + " " + g.year + "</span>";
      else {
        var p = g.key.split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
        head = '<span class="dn">' + dt.getDate() + '</span><span class="dw">' + WD[dt.getDay()] + (searching ? " · " + MONTHS[dt.getMonth()].slice(0, 3).toUpperCase() + " " + dt.getFullYear() : "") + "</span>";
      }
      return '<section class="day" id="g-' + esc(g.key) + '"><div class="dhead">' + head + '</div><div class="evs">' + g.evs.map(card).join("") + "</div></section>";
    }).join("");
  }

  function renderBanner() {
    var b = $("banner"), codes = Object.keys(state.errors);
    if (!codes.length || allEvents().length) { b.hidden = true; return; }
    b.hidden = false;
    b.innerHTML = "<p>Could not load data from Google Sheets. Make sure your Google Sheet is published to the web (File -> Share -> Publish to web).</p><button type=\"button\" class=\"btn\" data-act=\"retry\">Try again</button>";
  }

  function render() {
    var evs = allEvents(), byDay = {};
    evs.forEach(function (e) { e.days.forEach(function (k) { (byDay[k] = byDay[k] || []).push(e); }); });
    $("mTitle").textContent = MONTHS[state.view.m] + " " + state.view.y;
    $("mBE").textContent = "พ.ศ. " + (state.view.y + 543);
    renderStats(evs); renderGrid(byDay); renderList(evs); renderBanner();
    if (state.artist) renderSide();
    if (state.synced) {
      var t = new Date(state.synced);
      $("sync").textContent = "· synced " + pad(t.getHours()) + ":" + pad(t.getMinutes());
    }
  }

  /* ---------- artist panel ---------- */
  function normName(n) { return String(n || "").toLowerCase().replace(/\([^)]*\)/g, "").replace(/\s*-\s*talk\s*$/, "").replace(/\s+/g, " ").trim(); }
  function longDate(ev) { return ev.dateText + " " + ev.year; }
  function stat(k, v) { return "<div><dt>" + k + "</dt><dd>" + esc(v) + "</dd></div>"; }
  function renderSide() {
    var key = normName(state.artist), tk = todayKey();
    $("sideTitle").textContent = state.artist;
    var evs = allEvents().filter(function (e) { return e.artists.some(function (a) { return normName(a.name) === key; }); });
    var dated = evs.filter(function (e) { return e.days.length && !e.cancelled; });
    var past = dated.filter(function (e) { return e.last < tk; }).sort(function (a, b) { return a.last < b.last ? 1 : a.last > b.last ? -1 : 0; });
    var next = dated.filter(function (e) { return e.last >= tk; }).sort(function (a, b) { return a.first < b.first ? -1 : a.first > b.first ? 1 : 0; });
    var been = past.filter(function (e) { return e.marked; }).length;
    var venues = {}, years = {};
    past.forEach(function (e) { var v = e.venue || e.oldVenue; if (v) venues[v] = (venues[v] || 0) + 1; years[e.year] = (years[e.year] || 0) + 1; });
    var vlist = Object.keys(venues).sort(function (a, b) { return venues[b] - venues[a] || (a < b ? -1 : 1); });
    var ylist = Object.keys(years).sort();
    var maxY = Math.max.apply(null, ylist.map(function (y) { return years[y]; }).concat([1]));
    var h = '<p class="s-count"><b>' + past.length + "</b>past " + (past.length === 1 ? "show" : "shows") + " in Thailand</p>";
    if (next.length) h += '<p class="s-next">Next: <b>' + esc(longDate(next[0])) + "</b>" + ((next[0].venue || next[0].oldVenue) ? " · " + esc(next[0].venue || next[0].oldVenue) : "") + "</p>";
    if (past.length) {
      h += '<dl class="s-stats">' + stat("You went", been + " of " + past.length) + stat("Venues", String(vlist.length)) + stat("First", longDate(past[past.length - 1])) + stat("Latest", longDate(past[0])) + "</dl>";
      if (ylist.length > 1) h += '<h3 class="s-h">By year</h3><ul class="s-years">' + ylist.map(function (y) { return '<li><span class="y">' + y + '</span><span class="bar"><i style="width:' + Math.round(years[y] / maxY * 100) + '%"></i></span><span class="n">' + years[y] + "</span></li>"; }).join("") + "</ul>";
      if (vlist.length) h += '<h3 class="s-h">Venues</h3><ul class="s-venues">' + vlist.slice(0, 4).map(function (v) { return "<li><span>" + esc(v) + '</span><span class="n">×' + venues[v] + "</span></li>"; }).join("") + "</ul>";
      h += '<h3 class="s-h">Past shows</h3><ul class="s-list">' + past.map(function (e) {
        var v = e.venue || e.oldVenue;
        return '<li><button type="button" data-act="sideev" data-id="' + esc(e.id) + '"><span class="d">' + esc(longDate(e)) + (e.marked ? ' <span class="ck">✔</span>' : "") + '</span><span class="t">' + esc(e.name) + "</span>" + (v ? '<span class="v">' + esc(v) + "</span>" : "") + (e.note ? '<span class="nt">' + esc(e.note) + "</span>" : "") + "</button></li>";
      }).join("") + "</ul>";
    } else h += '<p class="s-empty">No past shows listed for this artist in your sheet.</p>';
    h += '<p class="s-foot">Counted from every year tab in your sheet. Cancelled shows are left out.</p>';
    $("sideBody").innerHTML = h;
  }
  function openSide(name) {
    state.artist = name; renderSide();
    $("side").classList.add("open"); $("side").setAttribute("aria-hidden", "false"); $("scrim").hidden = false;
    $("sideClose").focus();
  }
  function closeSide() {
    state.artist = ""; $("side").classList.remove("open"); $("side").setAttribute("aria-hidden", "true"); $("scrim").hidden = true;
  }

  /* ---------- navigation ---------- */
  function go(y, m) { state.view = { y: y, m: m }; render(); }
  function flash(el) { el.classList.add("flash"); setTimeout(function () { el.classList.remove("flash"); }, 1700); }
  function scrollTo(el) { el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" }); }

  function jumpEvent(id) {
    var el = $("ev-" + id);
    if (!el) {
      var ev = allEvents().filter(function (e) { return e.id === id; })[0];
      if (!ev) return;
      var p = (ev.days[0] || ev.first).split("-");
      state.q = ""; $("q").value = ""; state.marked = false; $("markedBtn").setAttribute("aria-pressed", "false");
      go(+p[0], +p[1] - 1);
      el = $("ev-" + id);
    }
    if (el) { scrollTo(el); flash(el); }
  }
  function jumpDay(k) {
    var groups = Array.prototype.slice.call(document.querySelectorAll("#list .day"));
    var hit = groups.filter(function (g) { return g.id.slice(2) >= k && /^\d/.test(g.id.slice(2)); })[0] || groups[groups.length - 1];
    if (hit) { scrollTo(hit); flash(hit); }
  }
